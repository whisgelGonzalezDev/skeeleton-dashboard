      content="react admin dashboard, react template, vite, typescript, tailwind css, admin panel, boilerplate, dashboard scaffold"

    <link rel="canonical" href="https://skeeleton-dashboard.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://skeeleton-dashboard.vercel.app/" />
    <meta property="og:title" content="Skeeleton Base — Production-ready React Admin Dashboard" />
    <meta
      property="og:description"
      content="Auth, dark mode, i18n, analytics charts and a clean feature-based architecture — out of the box."

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var s = localStorage.getItem('skeeleton_theme')
        if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
